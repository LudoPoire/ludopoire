  - role: "PhD researcher"
    org: "Centre International de Recherche en Infectiologie (CIRI)"
    start: "2023"
    end: "2026"
    summary: "**Title** : Uncovering bacterial immunity against conjugative plasmids in opportunistic pathogens. \n
- Demonstrated the **phenotypic variability in conjugation rates** at the species scale. \n
- Identified and characterized **four new defense systems against plasmids** in *A. baumannii*. \n

**Methods used:**

- **High-throughput genomics** : DNA/RNA-Seq, genome annotation, data analysis.

- **Microbiology** : high-throughput screening, assay development and optimization.

- **Molecular biology** : cloning, CRISPRi, functional genetics, flow cytometry, live-cell imaging.

- **Laboratory Safety Training** : routine work with BSL-2 pathogens."

